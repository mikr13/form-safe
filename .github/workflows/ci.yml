name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and package Chrome / Firefox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bun run compile
      - name: Package Chrome
        run: bun run zip
      - name: Package Firefox
        run: bun run zip:firefox
      - name: Check whitespace
        run: git diff --check
      - name: Upload build archives
        uses: actions/upload-artifact@v7.0.2
        with:
          name: form-safe-builds
          path: .output/*.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
