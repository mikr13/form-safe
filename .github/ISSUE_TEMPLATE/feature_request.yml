name: Feature request
description: Propose a focused improvement to Form Safe.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a concrete form-editing or navigation scenario.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what the user would experience and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and permissions
      description: Would this need new permissions, storage, or network access? Explain, or write "None expected".
